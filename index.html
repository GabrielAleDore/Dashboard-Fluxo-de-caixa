<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Condomínio Agrícola Familiar Bachinski — Gestão Financeira &amp; Fluxo de Caixa</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Roboto+Mono:wght@400;500;700&display=swap"
    rel="stylesheet">

  <!-- Bibliotecas Externas -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script
    src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <!-- Módulos de Estilo CSS -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/kpis.css">
  <link rel="stylesheet" href="css/charts.css">
  <link rel="stylesheet" href="css/alerts.css">
  <link rel="stylesheet" href="css/table.css">
</head>

<body>

  <!-- TELA DE UPLOAD -->
  <div id="upload-overlay">
    <div class="upload-logo">🌾 Condomínio Agrícola Familiar <span style="color:var(--green)">Bachinski</span></div>
    <div class="upload-box" id="drop-zone" onclick="document.getElementById('file-input').click()">
      <div class="upload-icon">📊</div>
      <div class="upload-title">Carregar Base de Dados</div>
      <div class="upload-sub">
        Arraste o arquivo <strong>CSV</strong> aqui ou clique para selecionar.<br>
        Compatível com <code>download (3).csv</code> ou <code>fluxocaixa_looker_ready.csv</code>
      </div>
      <button class="upload-btn" onclick="event.stopPropagation();document.getElementById('file-input').click()">
        📂 Selecionar Arquivo CSV
      </button>
      <button type="button" class="upload-demo-btn" id="btn-demo-data"
        onclick="event.stopPropagation();App.loadDemoData()">
        ⚡ Carregar Dados de Demonstração
      </button>
      <div class="upload-hint">Suporte a: separador vírgula ou ponto-e-vírgula · Encoding UTF-8 ou Latin-1</div>
    </div>
    <input type="file" id="file-input" accept=".csv" />
  </div>

  <!-- BARRA DE PROGRESSO DE CARREGAMENTO -->
  <div class="loading-bar" id="loading-bar" style="width:0"></div>

  <!-- DASHBOARD PRINCIPAL -->
  <div id="dashboard">
    <!-- 1. Cabeçalho -->
    <header id="header-container"></header>

    <main class="content">
      <!-- 2. Cards de Indicadores Executivos -->
      <section id="kpi-container"></section>

      <!-- 3. Linha de Operações: Alertas de Vencimento, Saldos e Contas a Receber/Pagar -->
      <section class="bottom-row">
        <!-- Alertas de Vencimento e Saldos Diários -->
        <aside id="alerts-container"></aside>

        <!-- Contas a Receber (Superior) e Contas a Pagar (Inferior) -->
        <div id="table-container"></div>
      </section>

      <!-- 4. Gráfico de Desembolsos Programados por Vencimento (Largura Total) -->
      <section id="charts-container"></section>
    </main>
  </div>

  <!-- SCRIPTS MODULARES -->
  <script src="js/utils.js"></script>
  <script src="js/state.js"></script>
  <script src="js/components/header.js"></script>
  <script src="js/components/kpi-cards.js"></script>
  <script src="js/components/charts.js"></script>
  <script src="js/components/alerts.js"></script>
  <script src="js/components/table.js"></script>
  <script src="js/csv-parser.js"></script>
  <script src="js/app.js"></script>

</body>

</html>
