<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Condomínio Agrícola Familiar Bachinski — Gestão Financeira &amp; Fluxo de Caixa</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Roboto+Mono:wght@400;500;700&display=swap"
    rel="stylesheet">

  <!-- Bibliotecas Externas -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script
    src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <!-- Módulos de Estilo CSS (com cache busting) -->
  <link rel="stylesheet" href="css/main.css?v=2.9">
  <link rel="stylesheet" href="css/header.css?v=2.9">
  <link rel="stylesheet" href="css/kpis.css?v=2.9">
  <link rel="stylesheet" href="css/charts.css?v=2.9">
  <link rel="stylesheet" href="css/alerts.css?v=2.9">
  <link rel="stylesheet" href="css/table.css?v=2.9">
</head>

<body>

  <!-- BARRA DE PROGRESSO DE CARREGAMENTO -->
  <div class="loading-bar" id="loading-bar" style="width:0"></div>

  <!-- DASHBOARD PRINCIPAL -->
  <div id="dashboard">
    <!-- 1. Cabeçalho -->
    <header id="header-container"></header>

    <main class="content">
      <!-- 2. Cards de Indicadores Executivos -->
      <section id="kpi-container"></section>

      <!-- 3. Linha de Operações: Alertas de Vencimento, Saldos e Contas a Receber/Pagar -->
      <section class="bottom-row">
        <!-- Alertas de Vencimento e Saldos Diários -->
        <aside id="alerts-container"></aside>

        <!-- Contas a Receber (Superior) e Contas a Pagar (Inferior) -->
        <div id="table-container"></div>
      </section>

      <!-- 4. Gráfico de Desembolsos Programados por Vencimento (Largura Total) -->
      <section id="charts-container"></section>
    </main>

    <!-- 5. Rodapé Informativo de Versão -->
    <footer class="dashboard-footer">
      <div class="footer-brand">
        🌾 Condomínio Agrícola Familiar <strong>Bachinski</strong> — Gestão Financeira &amp; Fluxo de Caixa
      </div>
      <div class="footer-version" title="Versão Semântica do Sistema">
        <span class="version-dot"></span>
        <span id="footer-version-text">Versão 2.7.1</span>
      </div>
    </footer>
  </div>

  <!-- SCRIPTS MODULARES (com cache busting) -->
  <script src="js/utils.js?v=2.9"></script>
  <script src="js/state.js?v=2.9"></script>
  <script src="js/components/header.js?v=2.9"></script>
  <script src="js/components/kpi-cards.js?v=2.9"></script>
  <script src="js/components/charts.js?v=2.9"></script>
  <script src="js/components/alerts.js?v=2.9"></script>
  <script src="js/components/table.js?v=2.9"></script>
  <script src="js/csv-parser.js?v=2.9"></script>
  <script src="js/app.js?v=2.9"></script>

</body>

</html>
